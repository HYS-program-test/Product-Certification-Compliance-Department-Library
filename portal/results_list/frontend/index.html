<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --blue: #7B98A8;
  --blue-dark: #5C7A8A;
  --blue-pale: #EEF2F4;
  --white: #FFFFFF;
  --text: #33414A;
  --muted: #8A9AA3;
  --border: #EBEEF0;
}
html,body{margin:0;padding:0;font-family:'Noto Sans TC',-apple-system,Arial,sans-serif;background:var(--white);color:var(--text)}

#list{ width:100%; }
.row{
  display:flex; align-items:center; gap:18px;
  padding:16px 4px; border-bottom:1px solid var(--border);
}
.row:first-child{ border-top:1px solid var(--border); }

.badge{
  flex:0 0 auto; font-size:16px; font-weight:700; padding:5px 12px; border-radius:999px;
  color:var(--white); white-space:nowrap;
}

.body{ flex:1 1 auto; min-width:0; }
.title{ font-size:16px; font-weight:700; color:var(--text); }
.meta{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.6; }

.action{ flex:0 0 auto; }
.add-btn{
  border:1px solid var(--blue); background:var(--white); color:var(--blue-dark);
  border-radius:999px; padding:7px 16px; font-size:12px; font-weight:700; cursor:pointer;
  transition: background .12s, color .12s;
}
.add-btn:hover{ background:var(--blue); color:var(--white); }
.add-btn.added{ background:var(--blue-pale); border-color:var(--blue-pale); color:var(--blue-dark); cursor:default; }
.add-btn.unavailable{ background:#F3F4F5; border-color:#F3F4F5; color:#C3CACE; cursor:default; }
.add-btn.checking{ background:var(--white); border-color:var(--border); color:var(--muted); cursor:default; }

.empty{ text-align:center; color:var(--muted); font-size:13px; padding:36px 0; }
</style>
</head>
<body>
<div id="list"></div>

<script>
const RENDER_EVENT = "streamlit:render";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
}
function componentReady() { postToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setComponentValue(value) { postToStreamlit("streamlit:setComponentValue", { value }); }
function setFrameHeight(height = 400) { postToStreamlit("streamlit:setFrameHeight", { height }); }

let nonceCounter = 0;
const listEl = document.getElementById("list");

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function render(args) {
  const rows = args.rows || [];
  listEl.innerHTML = "";

  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">查無符合條件的資料。</div>';
    setFrameHeight(120);
    return;
  }

  rows.forEach(row => {
    const rowEl = document.createElement("div");
    rowEl.className = "row";

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.style.background = args.badge_color || "#7B98A8";
    badge.textContent = args.badge_text || "";
    rowEl.appendChild(badge);

    const bodyEl = document.createElement("div");
    bodyEl.className = "body";
    bodyEl.innerHTML = `
      <div class="title">${escapeHtml(row.title)}</div>
      <div class="meta">${escapeHtml(row.meta)}</div>
    `;
    rowEl.appendChild(bodyEl);

    const actionEl = document.createElement("div");
    actionEl.className = "action";
    const btn = document.createElement("button");

    if (row.checking) {
      btn.className = "add-btn checking";
      btn.textContent = "確認中…";
      btn.disabled = true;
    } else if (!row.available) {
      btn.className = "add-btn unavailable";
      btn.textContent = "無檔案";
      btn.disabled = true;
    } else if (row.added) {
      btn.className = "add-btn added";
      btn.textContent = "✓ 已加入";
      btn.disabled = true;
    } else {
      btn.className = "add-btn";
      btn.textContent = "＋ 加入下載";
      btn.addEventListener("click", () => {
        nonceCounter += 1;
        setComponentValue({ action: "add", row_id: row.row_id, nonce: nonceCounter });
      });
    }

    actionEl.appendChild(btn);
    rowEl.appendChild(actionEl);

    listEl.appendChild(rowEl);
  });

  setFrameHeight(Math.max(120, document.body.scrollHeight + 10));
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== RENDER_EVENT || !data.args) return;
  render(data.args);
});

componentReady();
setFrameHeight(400);
</script>
</body>
</html>
