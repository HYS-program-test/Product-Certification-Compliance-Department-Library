<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --blue: #7B98A8;
  --blue-dark: #5C7A8A;
  --blue-pale: #EEF2F4;
  --bg: #F7F8F9;
  --white: #FFFFFF;
  --text: #33414A;
  --muted: #8A9AA3;
  --danger: #B3453B;
  --danger-bg: #FBEEEC;
}
html,body{margin:0;padding:0;font-family:'Noto Sans TC',-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text)}

#outer{
  display:flex; align-items:center; justify-content:center;
  min-height:560px; padding:20px;
}
#card{
  background:var(--white); border-radius:18px; width:100%; max-width:420px;
  padding:44px 40px; box-shadow:0 8px 28px rgba(51,65,74,0.08); border:1px solid #ECEFF0;
}
.brand{
  font-family:Georgia,'Noto Serif TC',serif; font-size:20px; font-weight:700;
  color:var(--blue-dark); letter-spacing:.3px; margin:0 0 26px 0; line-height:1.3;
  text-align:center;
}
.subtitle{ font-size:13px; color:var(--muted); margin-bottom:28px; line-height:1.6; }

label{ font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:6px; }
input[type=text], input[type=email]{
  width:100%; box-sizing:border-box; font-size:15px; padding:11px 14px;
  border:1px solid #DDE3E6; border-radius:10px; color:var(--text);
  margin-bottom:16px; outline:none; transition:border-color .12s;
}
input[type=text]:focus, input[type=email]:focus{ border-color:var(--blue); }

.btn{
  width:100%; border:none; border-radius:999px; padding:12px 0; font-size:14px; font-weight:700;
  cursor:pointer; transition:background .12s; margin-bottom:10px;
}
.btn-primary{ background:var(--blue); color:var(--white); }
.btn-primary:hover{ background:var(--blue-dark); }
.btn-secondary{ background:var(--blue-pale); color:var(--blue-dark); }
.btn-secondary:hover{ background:#e2e9ec; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ margin-bottom:0; }

.error-box{
  background:var(--danger-bg); color:var(--danger); font-size:12.5px;
  padding:10px 14px; border-radius:10px; margin-bottom:16px; line-height:1.6;
}
.success-line{ font-size:13px; color:var(--blue-dark); margin-bottom:18px; line-height:1.6; }
.footer-note{ font-size:11px; color:var(--muted); text-align:center; margin-top:22px; }
</style>
</head>
<body>
<div id="outer">
  <div id="card">
    <div class="brand">Certification-Compliance-Department-Library</div>
    <div id="error-slot"></div>
    <div id="form-slot"></div>
    <div class="footer-note">※ 本系統僅限公司同仁使用</div>
  </div>
</div>

<script>
const RENDER_EVENT = "streamlit:render";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
}
function componentReady() { postToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setComponentValue(value) { postToStreamlit("streamlit:setComponentValue", { value }); }
function setFrameHeight(height = 620) { postToStreamlit("streamlit:setFrameHeight", { height }); }

let nonceCounter = 0;

function send(action, extra = {}) {
  nonceCounter += 1;
  setComponentValue({ action, email: "", code: "", nonce: nonceCounter, ...extra });
}

function renderEmailStep() {
  const formSlot = document.getElementById("form-slot");
  formSlot.innerHTML = `
    <label>公司信箱</label>
    <input type="email" id="email-input" placeholder="請輸入 @hotaidev.com.tw 信箱" />
    <button class="btn btn-primary" id="send-btn">寄送驗證碼</button>
  `;
  const emailInput = document.getElementById("email-input");
  const sendBtn = document.getElementById("send-btn");

  const submit = () => {
    nonceCounter += 1;
    setComponentValue({ action: "send", email: emailInput.value, code: "", nonce: nonceCounter });
  };
  sendBtn.addEventListener("click", submit);
  emailInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  emailInput.focus();
}

function renderCodeStep(emailHint) {
  const formSlot = document.getElementById("form-slot");
  formSlot.innerHTML = `
    <div class="success-line">驗證碼已寄至 <strong>${escapeHtml(emailHint || "")}</strong>，請於 5 分鐘內輸入</div>
    <label>驗證碼</label>
    <input type="text" id="code-input" placeholder="請輸入 6 位數驗證碼" maxlength="6" />
    <div class="btn-row">
      <button class="btn btn-primary" id="verify-btn">驗證登入</button>
      <button class="btn btn-secondary" id="resend-btn">重新寄送</button>
    </div>
  `;
  const codeInput = document.getElementById("code-input");
  const verifyBtn = document.getElementById("verify-btn");
  const resendBtn = document.getElementById("resend-btn");

  const submitVerify = () => {
    nonceCounter += 1;
    setComponentValue({ action: "verify", email: "", code: codeInput.value, nonce: nonceCounter });
  };
  verifyBtn.addEventListener("click", submitVerify);
  codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitVerify(); });
  resendBtn.addEventListener("click", () => {
    nonceCounter += 1;
    setComponentValue({ action: "resend", email: "", code: "", nonce: nonceCounter });
  });
  codeInput.focus();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== RENDER_EVENT || !data.args) return;

  const args = data.args;
  const errorSlot = document.getElementById("error-slot");
  errorSlot.innerHTML = args.error
    ? `<div class="error-box">${escapeHtml(args.error)}</div>`
    : "";

  if (args.step === "code") {
    renderCodeStep(args.email_hint);
  } else {
    renderEmailStep();
  }

  setFrameHeight(document.body.scrollHeight + 20);
});

componentReady();
setFrameHeight(620);
</script>
</body>
</html>
